# 本地 MySQL + Redis（启动应用前请先执行: docker compose up -d）
services:
  mysql:
    image: mysql:8.4
    container_name: mykanban-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kanban
      MYSQL_USER: kanban
      MYSQL_PASSWORD: kanban
    ports:
      - '3306:3306'
    volumes:
      - mykanban_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ukanban', '-pkanban']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mykanban-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - mykanban_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mykanban_mysql_data:
  mykanban_redis_data:
