services:
  - type: web
    name: mykanban
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server.js --prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: mysql
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: '3306'
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: REDIS_URL
        sync: false
